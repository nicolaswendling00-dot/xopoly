<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xopoly">
<title>Xopoly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="accueil" class="ecran">
  <h1 class="neon">Xopoly</h1>
  <p class="accroche">Le jeu de plateau où l’on paie en frissons, ou en nature. À deux, sur un seul téléphone.</p>
  <form id="formNouvelle">
    <div class="duo">
      <div class="qui"><label>Premier joueur<input name="j1" maxlength="14" autocomplete="off" placeholder="Prénom"></label><div class="genre" role="radiogroup" aria-label="Premier joueur"><label><input type="radio" name="g1" value="f" checked><span>Elle</span></label><label><input type="radio" name="g1" value="m"><span>Lui</span></label></div></div>
      <div class="qui"><label>Second joueur<input name="j2" maxlength="14" autocomplete="off" placeholder="Prénom"></label><div class="genre" role="radiogroup" aria-label="Second joueur"><label><input type="radio" name="g2" value="f"><span>Elle</span></label><label><input type="radio" name="g2" value="m" checked><span>Lui</span></label></div></div>
    </div>
    <fieldset class="niveaux">
      <legend>Intensité des gages</legend>
      <label><input type="radio" name="niveau" value="0"><span><b>Doux</b>Baisers, massages, confidences.</span></label>
      <label><input type="radio" name="niveau" value="1" checked><span><b>Coquin</b>Vêtements qui tombent, caresses osées.</span></label>
      <label><input type="radio" name="niveau" value="2"><span><b>Brûlant</b>Sexe, caresses intimes, oral.</span></label>
    </fieldset>
    <label>Mot d’arrêt<input name="stop" maxlength="20" autocomplete="off" placeholder="Ananas" aria-describedby="stopAide"></label>
    <p id="stopAide" class="aide">Dit par l’un de vous, il arrête le gage en cours, sans discussion.</p>
    <button class="btn principal" type="submit">Commencer la partie</button>
    <button class="btn second" type="button" id="reprendre" hidden>Reprendre la partie en cours</button>
  </form>
  <p class="aide">Réservé aux adultes consentants.</p>
</main>

<main id="jeu" class="ecran" hidden>
  <header class="hud-haut">
    <div class="joueur" data-j="0"><span class="nom"></span><span class="argent"><b>0</b></span><span class="lieux"></span></div>
    <button class="btn menu" id="btnMenu" aria-label="Menu"><i></i><i></i><i></i></button>
    <div class="joueur" data-j="1"><span class="nom"></span><span class="argent"><b>0</b></span><span class="lieux"></span></div>
  </header>
  <div class="scene" id="scene">
    <div class="plateau" id="plateau">
      <div class="tranche bas"></div><div class="tranche haut"></div><div class="tranche gauche"></div><div class="tranche droite"></div>
      <div class="ombre"></div><div class="fond"></div>
      <div class="centre">
        <div class="cadre-neon"></div>
        <p class="logo-plateau">Xopoly</p>
        <p class="devise">En frissons ou en nature</p>
        <div class="pile gage" id="pileGage"></div>
        <div class="pile tentation" id="pileTentation"></div>
        <div class="piste-des"><div class="de"><div class="cube"></div></div><div class="de"><div class="cube"></div></div></div>
      </div>
    </div>
  </div>
  <footer class="hud-bas">
    <p id="journal" class="journal" aria-live="polite"></p>
    <button class="btn principal" id="btnLancer">Lancer les dés</button>
  </footer>
</main>

<main id="fin" class="ecran" hidden>
  <h1 id="finTitre" class="neon"></h1>
  <p id="finTexte" class="accroche"></p>
  <div id="finCarte" class="carte-fin"></div>
  <button class="btn principal" id="btnRejouer">Nouvelle partie</button>
</main>

<div id="calque" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
